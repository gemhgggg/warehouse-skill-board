<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="仓储部成品仓与原辅料仓员工技能矩阵、技能缺口和培养计划看板" />
    <title>仓储部员工技能看板</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="board-header">
      <div class="topline">
        <div>
          <p class="eyebrow">仓储部 · 2026 年 Q1</p>
          <p class="update-note">数据更新：<span id="updatedAt">2026-04-23</span></p>
        </div>
        <div class="header-actions">
          <div class="source-tags" aria-label="数据范围">
            <span>成品仓</span>
            <span>原辅料仓</span>
          </div>
          <button class="editor-entry" id="openEditor" type="button">在线编辑</button>
        </div>
      </div>
      <h1 class="tile-title" aria-label="员工技能矩阵看板">
        <span>员</span><span>工</span><span>技</span><span>能</span><span>矩</span><span>阵</span><span>看</span><span>板</span>
      </h1>
    </header>

    <main>
      <section class="control-panel" aria-label="筛选条件">
        <div class="segmented" role="group" aria-label="仓库筛选">
          <button class="segment active" data-area="全部" type="button">全部</button>
          <button class="segment" data-area="成品仓" type="button">成品仓</button>
          <button class="segment" data-area="原辅料仓" type="button">原辅料仓</button>
        </div>
        <label class="select-wrap">
          <span>业务组</span>
          <select id="groupFilter" aria-label="选择业务组">
            <option value="全部">全部业务组</option>
          </select>
        </label>
        <label class="search-wrap">
          <span class="search-label">搜索</span>
          <input id="searchInput" type="search" placeholder="员工、岗位或技能" autocomplete="off" />
        </label>
      </section>

      <section class="kpi-grid" aria-label="技能概览">
        <article class="kpi-card"><p>业务组</p><strong id="kpiGroups">9</strong><span>当前范围</span></article>
        <article class="kpi-card"><p>员工人数</p><strong id="kpiEmployees">42</strong><span>矩阵内员工</span></article>
        <article class="kpi-card emphasis"><p>岗位技能达标率</p><strong id="kpiAttainment">95.7%</strong><span>实际分 ≥ 岗位要求</span></article>
        <article class="kpi-card alert"><p>待提升技能项</p><strong id="kpiGaps">24</strong><span>未达到岗位要求</span></article>
      </section>

      <section class="legend-row" aria-label="技能等级说明">
        <div class="section-heading">
          <div>
            <p class="eyebrow">分组矩阵墙</p>
            <h2>员工技能一览</h2>
          </div>
          <p id="resultNote">点击员工行查看明细，点击卡片右下角展开完整矩阵。</p>
        </div>
        <div class="legend" id="legend"></div>
      </section>

      <section class="matrix-wall" id="matrixWall" aria-live="polite"></section>
    </main>

    <div class="dialog-backdrop" id="dialogBackdrop" hidden>
      <section class="dialog" id="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
        <header class="dialog-header">
          <div>
            <p class="eyebrow" id="dialogEyebrow">技能矩阵</p>
            <h2 id="dialogTitle">明细</h2>
          </div>
          <button class="close-button" id="closeDialog" type="button" aria-label="关闭">×</button>
        </header>
        <div class="dialog-body" id="dialogBody"></div>
      </section>
    </div>

    <div class="dialog-backdrop" id="loginBackdrop" hidden>
      <section class="dialog login-dialog" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
        <header class="dialog-header">
          <div>
            <p class="eyebrow">管理员验证</p>
            <h2 id="loginTitle">在线编辑登录</h2>
          </div>
          <button class="close-button" id="closeLogin" type="button" aria-label="关闭">×</button>
        </header>
        <form class="login-form" id="loginForm">
          <label><span>手机号</span><input id="editorPhone" type="tel" inputmode="numeric" autocomplete="username" placeholder="请输入已登记手机号" required /></label>
          <label><span>密码</span><input id="editorPassword" type="password" autocomplete="current-password" placeholder="请输入密码" required /></label>
          <p class="form-message" id="loginMessage" role="alert"></p>
          <div class="form-actions"><button class="secondary-button" id="cancelLogin" type="button">取消</button><button class="primary-button" type="submit">验证并进入</button></div>
        </form>
      </section>
    </div>

    <div class="editor-backdrop" id="editorBackdrop" hidden>
      <aside class="editor-panel" id="editorPanel" aria-labelledby="editorTitle">
        <header class="editor-header">
          <div><p class="eyebrow">已通过权限验证</p><h2 id="editorTitle">在线编辑技能数据</h2></div>
          <button class="close-button" id="closeEditor" type="button" aria-label="关闭编辑面板">×</button>
        </header>
        <div class="editor-toolbar">
          <label><span>业务组</span><select id="editGroupSelect"></select></label>
          <label><span>员工</span><select id="editEmployeeSelect"></select></label>
          <button class="secondary-button" id="addEmployee" type="button">＋ 新增人员</button>
        </div>
        <form class="employee-editor" id="employeeEditor">
          <div class="employee-fields">
            <label><span>姓名</span><input id="editName" required /></label>
            <label><span>岗位</span><input id="editRole" required /></label>
            <label><span>岗位名称</span><input id="editPosition" /></label>
            <label><span>顶岗人</span><input id="editBackup" /></label>
          </div>
          <div class="skill-editor-heading"><div><h3>技能分数</h3><p>分数范围为 0–100；岗位要求填 0 表示不要求。</p></div></div>
          <div class="skill-editor" id="skillEditor"></div>
          <p class="form-message" id="editorMessage" role="status"></p>
          <div class="editor-actions">
            <button class="danger-button" id="deleteEmployee" type="button">删除当前人员</button>
            <div><button class="secondary-button" id="logoutEditor" type="button">退出登录</button><button class="primary-button" type="submit">保存全部修改</button></div>
          </div>
        </form>
      </aside>
    </div>

    <script src="./config.js"></script>
    <script src="./data.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
